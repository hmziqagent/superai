[workspace]
resolver = "3"
members = ["crates/superai-config", "crates/superai-core", "crates/superai-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
readme = "README.md"
keywords = ["ai", "cli", "config", "harness"]
categories = ["command-line-utilities", "config"]
publish = false
repository = "https://github.com/freeoxide/superai"

[workspace.dependencies]
superai-config = { path = "crates/superai-config" }
superai-core = { path = "crates/superai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.23"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_crate_dependencies = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Groups. priority = -1 makes individual keys below override them.
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
# Transitive-only in practice (winnow 0.7 vs 1.0 under toml_edit); not actionable here.
multiple_crate_versions = "allow"

# 1. Suppression escape hatch
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# 2. Unfinished / debug leftovers
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "warn"

# 3. Panic paths
unwrap_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
string_slice = "warn"
unchecked_time_subtraction = "warn"

# 4. Silently swallowed errors and futures
let_underscore_future = "deny"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# 5. Clone / ownership slop
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
needless_pass_by_value = "warn"
needless_pass_by_ref_mut = "warn"
str_to_string = "warn"
inefficient_to_string = "warn"

# 6. Unsafe hygiene (tripwire: crate has zero unsafe)
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
mem_forget = "warn"

# 7. Numeric correctness
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

# 8. Structure
excessive_nesting = "warn"
too_many_lines = "warn"
ignore_without_reason = "warn"
tests_outside_test_module = "warn"

# 9. Pedantic opt-outs (documented high false-positive rate)
type_complexity = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"

"$schema" = "https://conductor.build/schemas/settings.schema.json"
claude_code_executable_path = "/opt/homebrew/bin/claude"
codex_executable_path = "/opt/homebrew/bin/codex"
claude_provider = "anthropic"

[models]
default = "sonnet"
review = "opus"

[models.claude_code]
default_effort_level = "medium"

[scripts]
setup = "pnpm install"
run_mode = "concurrent"

[scripts.run.web]
command = "pnpm dev --port $CONDUCTOR_PORT"
available_in = ["local", "cloud"]
default = true

[environment_variables]
API_BASE_URL = "http://localhost:3000"

[environment_variables.local]
CONDUCTOR_TARGET = "local"

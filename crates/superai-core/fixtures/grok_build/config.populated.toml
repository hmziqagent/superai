# populated grok-build config
[[providers]]
id = "openai"
url = "https://api.openai.com/v1/chat/completions"
api_key_vars = "OPENAI_API_KEY"

[model.grok-custom]
model = "grok-4"
base_url = "https://api.x.ai/v1"
env_key = "XAI_API_KEY"
temperature = 0.7

[features]
memory = true
subagents = true

[toolset]
enabled = ["read_file", "grep", "bash"]
disabled = []

[shell_environment_policy]
allow = ["PATH", "HOME"]
deny = ["LD_PRELOAD"]

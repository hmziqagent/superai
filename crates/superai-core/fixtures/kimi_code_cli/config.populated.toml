default_model = "k3"
default_permission_mode = "manual"

[providers.kimi]
type = "kimi"
base_url = "https://api.moonshot.ai/v1"
api_key = "sk-fake-moonshot-key-1234"

[models.k3]
provider = "kimi"
model = "kimi-k2.5"
max_context_size = 262144
capabilities = ["thinking", "tool_use"]

[mcp]
startup_timeout_ms = 30000
tool_timeout_ms = 60000

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(*)"
reason = "allow bash"

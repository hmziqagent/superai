[advisories]
version = 2
ignore = [
    # RUSTSEC-2024-0449 unsafe-libyaml (unmaintained) reaches this tree only via
    # toride-registry -> serde_yaml (deprecated); no safe upgrade exists; drop
    # when toride's own registry rework lands here.
    "RUSTSEC-2024-0449",
]

[bans]
multiple-versions = "warn"

[licenses]
version = 2
# Zlib: foldhash (via hashbrown under rusqlite), OSI-approved permissive;
# reviewed 2026-10-13, same rationale as option-ext/MPL-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

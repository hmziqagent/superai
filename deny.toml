[advisories]
version = 2
ignore = [
    # RUSTSEC-2024-0449 unsafe-libyaml (unmaintained) reaches this tree only via
    # toride-registry -> serde_yaml (deprecated); no safe upgrade exists; drop
    # when toride's own registry rework lands here.
    "RUSTSEC-2024-0449",
]

[bans]
multiple-versions = "warn"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "ISC", "CDLA-Permissive-2.0", "MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

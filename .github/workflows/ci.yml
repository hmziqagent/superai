name: CI
on: [push, pull_request]

jobs:
  quality-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Lint inheritance
        run: |
          for f in $(find . -name Cargo.toml -not -path './target/*' -not -path './Cargo.toml'); do
            grep -q 'workspace = true' "$f" || { echo "Missing [lints] workspace = true in $f"; exit 1; }
          done

      - name: No crate-level allow
        run: |
          if grep -rn '#!\[allow' --include='*.rs' crates/; then
            echo "crate-level #![allow] is forbidden"; exit 1
          fi

      - name: Test
        run: cargo test --workspace --all-features

      - name: Locked build
        run: cargo build --locked

  quality-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Lint inheritance
        shell: bash
        run: |
          for f in $(find . -name Cargo.toml -not -path './target/*' -not -path './Cargo.toml'); do
            grep -q 'workspace = true' "$f" || { echo "Missing [lints] workspace = true in $f"; exit 1; }
          done

      - name: No crate-level allow
        shell: bash
        run: |
          if grep -rn '#!\[allow' --include='*.rs' crates/; then
            echo "crate-level #![allow] is forbidden"; exit 1
          fi

      - name: Test
        run: cargo test --workspace --all-features

      - name: Locked build
        run: cargo build --locked

  quality-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Lint inheritance
        shell: bash
        run: |
          for f in $(find . -name Cargo.toml -not -path './target/*' -not -path './Cargo.toml'); do
            grep -q 'workspace = true' "$f" || { echo "Missing [lints] workspace = true in $f"; exit 1; }
          done

      - name: No crate-level allow
        shell: bash
        run: |
          if grep -rn '#!\[allow' --include='*.rs' crates/; then
            echo "crate-level #![allow] is forbidden"; exit 1
          fi

      - name: Test
        run: cargo test --workspace --all-features

      - name: Locked build
        run: cargo build --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-hack cargo-shear cargo-deny --locked
      - run: cargo hack check --workspace --each-feature --no-dev-deps
      - run: cargo shear --deny-warnings
      - run: cargo deny check

  # QAL-05: mutation testing, scoped to the safety-critical mutation family
  # via .cargo/mutants.toml. Allowed to fail while the kill score is being
  # driven up; the per-run mutants.json report is uploaded for trend
  # tracking against the recorded baseline in STATE.md.
  mutation-testing:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked
      - name: Mutation tests (scoped baseline)
        run: cargo mutants --in-place --output mutants.out --jobs 4 --no-times
      - name: Mutation score summary
        if: always()
        run: |
          if [ -f mutants.out/outcomes.json ]; then
            caught=$(grep -c '"scenario": "CaughtMutant"' mutants.out/outcomes.json || true)
            missed=$(grep -c '"scenario": "MissedMutant"' mutants.out/outcomes.json || true)
            timeout=$(grep -c '"scenario": "TimeoutMutant"' mutants.out/outcomes.json || true)
            unviable=$(grep -c '"scenario": "UnviableMutant"' mutants.out/outcomes.json || true)
            echo "caught: $caught, missed: $missed, timeout: $timeout, unviable: $unviable"
          else
            echo "no mutants.out/outcomes.json produced"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: mutants.out
